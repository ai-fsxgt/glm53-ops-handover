services:
  glm53-worker:
    image: ${SGLANG_IMAGE:?set SGLANG_IMAGE in .env}
    container_name: glm53-worker
    restart: unless-stopped
    init: true
    network_mode: host
    ipc: host
    user: "0:0"
    working_dir: /workspace

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    cap_add:
      - IPC_LOCK
      - SYS_PTRACE
      - SYS_RESOURCE

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576

    volumes:
      - "${MODEL_DIR:?set MODEL_DIR in .env}:/models/glm-5.3:ro"
      - "./sglang.yaml:/etc/sglang/agg.yaml:ro"
      - "${CACHE_DIR:?set CACHE_DIR in .env}:/root/.cache"

    environment:
      ETCD_ENDPOINTS: "${ETCD_ENDPOINTS:?set ETCD_ENDPOINTS in .env}"
      DYN_SYSTEM_PORT: "9090"
      DYN_SGL_ALLOW_TOP_LOGPROBS: "1"
      # 官方配方说明：该镜像的 forward-pass 指标上报会在首个 MTP 解码批次导致调度器崩溃，必须关闭
      DYN_FORWARDPASS_METRIC_PORT: ""
      HF_HUB_OFFLINE: "1"
      TRITON_CACHE_DIR: /root/.cache/triton

    command:
      - python3
      - -m
      - dynamo.sglang
      - --config
      - /etc/sglang/agg.yaml
      - --dsa-prefill-backend
      - flashmla_kv
      - --dyn-tool-call-parser
      - glm47
      - --dyn-reasoning-parser
      - glm45
      - --reasoning-parser
      - glm45

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9090/health", timeout=50)
      interval: 60s
      timeout: 60s
      retries: 10
      start_period: 120m
