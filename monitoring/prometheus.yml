global:
  scrape_interval: 10s
  evaluation_interval: 10s

# 新增推理节点时，在 dynamo-backend、dcgm-exporter、node-exporter 三处各加一行 IP
scrape_configs:
  - job_name: dynamo-frontend
    static_configs:
      - targets: ['10.10.93.89:8000']

  # 推理节点的 Dynamo 与 SGLang 指标（DYN_SYSTEM_PORT=9090）；6s 与 Dynamo 官方配置一致
  - job_name: dynamo-backend
    scrape_interval: 6s
    static_configs:
      - targets: ['10.10.92.6:9090', '10.10.92.7:9090']

  - job_name: dcgm-exporter
    scrape_interval: 5s
    static_configs:
      - targets: ['10.10.92.6:9400', '10.10.92.7:9400']

  - job_name: node-exporter
    static_configs:
      - targets: ['10.10.92.6:9100', '10.10.92.7:9100']
