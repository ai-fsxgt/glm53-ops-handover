name: glm53-monitoring

services:
  glm53-prometheus:
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE in .env}
    container_name: glm53-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 只供本机 Grafana 查询，不对外暴露
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  glm53-grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE in .env}
    container_name: glm53-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - glm53-prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
